<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Plain text</title>
    <style>
      body {
        height: 100dvh;
        margin: 0;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- The canvas without a text editor plugin, as most pages use it. -->
    <script type="module">
      import {
        colorControl,
        mountCanvas,
        noteTool,
        textTool,
        undoButton,
      } from "/demo/canvas.ts";
      // The build leaves out any import of it in `canvas.ts`, as that
      // file says.
      import "/demo/styles.css";

      const icon = () =>
        document.createElementNS("http://www.w3.org/2000/svg", "svg");
      mountCanvas(document.body, {
        toolbar: [
          [
            undoButton(icon()),
            noteTool(icon()),
            textTool(icon()),
            colorControl(),
          ],
        ],
      });
    </script>
  </body>
</html>
