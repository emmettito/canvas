<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Made by scripts/generate-icons.ts. The .ico is for browsers without
         SVG favicons, and the rest for home screens and installing. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Demo</title>
    <script>
      // Set before the first paint so the page doesn't flash the wrong theme.
      // `src/theme.ts` keeps it up to date after that. Nothing saved means
      // following the system.
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem("theme");
      } catch {
        // Storage can be unavailable, e.g. in some private windows.
      }
      // OLED was a darker dark, before it became the only one.
      if (savedTheme === "oled") {
        savedTheme = "dark";
      }
      document.documentElement.dataset.theme = ["light", "dark"].includes(
        savedTheme
      )
        ? savedTheme
        : matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
    </script>
  </head>
  <body>
    <!-- Each group of settings is a section, so more can be added. -->
    <dialog class="demo-settings" aria-labelledby="demo-settings-title">
      <div class="demo-settings-content">
        <div class="demo-settings-header">
          <h2 id="demo-settings-title">Settings</h2>
          <form method="dialog">
            <!-- The script adds its icon. -->
            <button
              class="demo-icon-button demo-settings-close"
              aria-label="Close"
            ></button>
          </form>
        </div>
        <section class="demo-settings-section">
          <h3>Appearance</h3>
          <fieldset class="demo-theme-picker">
            <legend>Theme</legend>
            <label class="demo-theme-option">
              <input type="radio" name="theme" value="system" />
              <span class="demo-theme-preview" data-preview="system"></span>
              System
            </label>
            <label class="demo-theme-option">
              <input type="radio" name="theme" value="light" />
              <span class="demo-theme-preview" data-preview="light"></span>
              Light
            </label>
            <label class="demo-theme-option">
              <input type="radio" name="theme" value="dark" />
              <span class="demo-theme-preview" data-preview="dark"></span>
              Dark
            </label>
          </fieldset>
          <!-- Each canvas has its own background, so this changes the open
               one's, and shows it. The script wires it up. -->
          <fieldset class="demo-background-picker">
            <legend>Canvas background</legend>
            <div class="demo-swatches">
              <label
                class="demo-swatch"
                title="White"
                style="--swatch: #ffffff"
              >
                <input
                  type="radio"
                  name="background"
                  value="#ffffff"
                  aria-label="White"
                />
              </label>
              <label
                class="demo-swatch"
                title="Paper"
                style="--swatch: #fdf6e3"
              >
                <input
                  type="radio"
                  name="background"
                  value="#fdf6e3"
                  aria-label="Paper"
                />
              </label>
              <label class="demo-swatch" title="Gray" style="--swatch: #e7e5e4">
                <input
                  type="radio"
                  name="background"
                  value="#e7e5e4"
                  aria-label="Gray"
                />
              </label>
              <label
                class="demo-swatch"
                title="Charcoal"
                style="--swatch: #1f2023"
              >
                <input
                  type="radio"
                  name="background"
                  value="#1f2023"
                  aria-label="Charcoal"
                />
              </label>
              <label
                class="demo-swatch"
                title="Black"
                style="--swatch: #000000"
              >
                <input
                  type="radio"
                  name="background"
                  value="#000000"
                  aria-label="Black"
                />
              </label>
              <label
                class="demo-swatch demo-swatch-custom"
                title="Custom color"
              >
                <input type="color" aria-label="Custom background" />
              </label>
            </div>
          </fieldset>
        </section>
      </div>
    </dialog>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
