# Opens weekly update PRs for releases at least 7 days old. Security updates
# skip the cooldown. `dependabot-auto-merge.yml` decides which PRs merge alone.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # A new version can change its output, which would fail `format:check`
        # and hold back the rest of the group.
        exclude-patterns: [oxfmt]
    ignore:
      # The types follow the Node version CI runs on, see `setup/action.yml`.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The second path is for the actions that composite actions use.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
