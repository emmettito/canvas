# Builds the demo page and publishes it to GitHub Pages on every push to main.
# Pages must be set to deploy from GitHub Actions in the repository settings.
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deploy job can publish, because dependencies' install scripts run in
# the build job.
permissions:
  contents: read

# Let a running deployment finish rather than cancelling it partway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build:demo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
