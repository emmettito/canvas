# Runs every check on pull requests and on pushes to main.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      # Tests the built demo page, see `playwright.config.ts`. Firefox runs
      # on a virtual screen, for its clipboard.
      - run: xvfb-run --auto-servernum npm run test:e2e

  # TEMPORARY: diagnoses the highlighter test failing on Linux WebKit only.
  debug-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test e2e/debug-highlighter.spec.ts e2e/canvas.spec.ts:282 --project=webkit --retries=0 --trace=on
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: debug-webkit
          path: test-results/
